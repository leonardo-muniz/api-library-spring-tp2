# Configurações do gateway, centralizadas no Config Server.
# Este arquivo é lido pelo config-server a partir do repositório
# Git e servido ao gateway quando ele sobe
# (spring.config.import=configserver:...).

server.port=8083

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

# Aponta diretamente para a chave pública de validação dos tokens
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/library}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/library/protocol/openid-connect/certs}